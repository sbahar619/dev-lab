kind: Deployment
apiVersion: apps/v1
metadata:
  name: user25-hello-world
spec:
  replicas: 3
  selector:
    matchLabels:
      app: user25-hello-world
  template:
    metadata:
      labels:
        app: user25-hello-world
    spec:
      containers:
        - resources: {}
          name: hello-world
          ports:
            - containerPort: 8080
              protocol: TCP
          imagePullPolicy: IfNotPresent
          image: quay.io/sbahar/dev-lab:v2